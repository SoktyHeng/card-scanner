<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your Card Scanner password</h1>
    <p>A password reset was requested for your account.</p>
    <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
    <p>If you did not request this, you can ignore this email. Your password has not changed.</p>
    <p>This link can be used once and expires according to your account security settings.</p>
  </body>
</html>
